name: ZAP Scan - Supermercados API

on:
  push:
    branches: [ main ]
  workflow_dispatch: # Permite iniciar manualmente

jobs:
  zap_scan:
    runs-on: ubuntu-latest
    name: OWASP ZAP Baseline Scan

    steps:
      - name: Checkout do código
        uses: actions/checkout@v3

      - name: ZAP Baseline Scan no endpoint /api/supermercados
        uses: zaproxy/action-baseline@v0.10.0
        with:
          target: 'http://51.124.96.205:5000/api/supermercados'
          fail_action: false # Não falha o job se encontrar vulnerabilidades
